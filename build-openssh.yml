name: Build OpenSSH RPM Matrix

on:
  workflow_dispatch:
  push:
    paths:
      - "openssh-*.tar.gz"
      - "openssl-*.tar.gz"
      - "Dockerfile"
      - "build_openssh.sh"
      - "openssh-uos20-kernel-panic-fix.patch"
      - ".github/workflows/build-openssh.yml"

# 修改这里的版本号并推送，即会构建全部目标并发布一个 Release。
env:
  SSH_VERSION: "10.6p1"
  SSL_VERSION: "3.5.9"

jobs:
  sources:
    name: Download and verify sources
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download and verify
        run: |
          set -e
          CURL=(curl --retry 3 --connect-timeout 15 --max-time 300 -fsSL)
          "${CURL[@]}" -o "openssh-${SSH_VERSION}.tar.gz" \
            "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${SSH_VERSION}.tar.gz" \
            || "${CURL[@]}" -o "openssh-${SSH_VERSION}.tar.gz" \
              "https://mirrors.tuna.tsinghua.edu.cn/OpenBSD/OpenSSH/portable/openssh-${SSH_VERSION}.tar.gz"
          "${CURL[@]}" -o "openssh-${SSH_VERSION}.tar.gz.asc" \
            "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-${SSH_VERSION}.tar.gz.asc"
          "${CURL[@]}" -o openssh-release-key.asc \
            "https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/RELEASE_KEY.asc"
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --import openssh-release-key.asc
          SIGNER="$(gpg --batch --status-fd 1 --verify "openssh-${SSH_VERSION}.tar.gz.asc" "openssh-${SSH_VERSION}.tar.gz" 2>/dev/null \
            | awk '$2 == "VALIDSIG" { print $3 }')"
          [ "$SIGNER" = "7168B983815A5EEF59A4ADFD2A3F414E736060BA" ] \
            || { echo "OpenSSH 签名指纹校验失败: $SIGNER"; exit 1; }
          "${CURL[@]}" -o "openssl-${SSL_VERSION}.tar.gz" \
            "https://github.com/openssl/openssl/releases/download/openssl-${SSL_VERSION}/openssl-${SSL_VERSION}.tar.gz" \
            || "${CURL[@]}" -o "openssl-${SSL_VERSION}.tar.gz" \
              "https://mirrors.tuna.tsinghua.edu.cn/openssl/source/openssl-${SSL_VERSION}.tar.gz"
          OPENSSL_SHA256="$("${CURL[@]}" \
            "https://api.github.com/repos/openssl/openssl/releases/tags/openssl-${SSL_VERSION}" \
            | jq -r --arg name "openssl-${SSL_VERSION}.tar.gz" '.assets[] | select(.name == $name) | .digest' \
            | sed 's/^sha256://')"
          [ -n "$OPENSSL_SHA256" ] && [ "$OPENSSL_SHA256" != "null" ] \
            || { echo "未找到 OpenSSL 官方 SHA256"; exit 1; }
          printf '%s  %s\n' "$OPENSSL_SHA256" "openssl-${SSL_VERSION}.tar.gz" | sha256sum -c -

      - name: Upload verified sources
        uses: actions/upload-artifact@v4
        with:
          name: verified-sources
          path: |
            openssh-${{ env.SSH_VERSION }}.tar.gz
            openssl-${{ env.SSL_VERSION }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    name: ${{ matrix.target }} / ${{ matrix.arch }}
    needs: sources
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: centos7
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "centos:7"
            os_tag: el7
            uos20: "0"
          - target: centos7
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "centos:7"
            os_tag: el7
            uos20: "0"
          - target: centos-stream8
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "quay.io/centos/centos:stream8"
            os_tag: el8
            uos20: "0"
          - target: centos-stream8
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "quay.io/centos/centos:stream8"
            os_tag: el8
            uos20: "0"
          - target: centos-stream9
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "quay.io/centos/centos:stream9"
            os_tag: el9
            uos20: "0"
          - target: centos-stream9
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "quay.io/centos/centos:stream9"
            os_tag: el9
            uos20: "0"
          - target: rockylinux8
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "rockylinux/rockylinux:8"
            os_tag: el8
            uos20: "0"
          - target: rockylinux8
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "rockylinux/rockylinux:8"
            os_tag: el8
            uos20: "0"
          - target: rockylinux9
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "rockylinux/rockylinux:9"
            os_tag: el9
            uos20: "0"
          - target: rockylinux9
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "rockylinux/rockylinux:9"
            os_tag: el9
            uos20: "0"
          - target: rockylinux10
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "rockylinux/rockylinux:10"
            os_tag: el10
            uos20: "0"
          - target: rockylinux10
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "rockylinux/rockylinux:10"
            os_tag: el10
            uos20: "0"
          - target: openeuler-24.03-sp2
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "openeuler/openeuler:24.03-lts-sp2"
            os_tag: oe2403sp2
            uos20: "0"
          - target: openeuler-24.03-sp2
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "openeuler/openeuler:24.03-lts-sp2"
            os_tag: oe2403sp2
            uos20: "0"
          - target: openeuler-24.03-sp3
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "openeuler/openeuler:24.03-lts-sp3"
            os_tag: oe2403sp3
            uos20: "0"
          - target: openeuler-24.03-sp3
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "openeuler/openeuler:24.03-lts-sp3"
            os_tag: oe2403sp3
            uos20: "0"
          - target: openeuler-24.03-sp4
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "openeuler/openeuler:24.03-lts-sp4"
            os_tag: oe2403sp4
            uos20: "0"
          - target: openeuler-24.03-sp4
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "openeuler/openeuler:24.03-lts-sp4"
            os_tag: oe2403sp4
            uos20: "0"
          - target: kylin-v10-sp1
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "hxsoong/kylin@sha256:93ba61a4785720106a5d02306042c06f4465bfcd5f577246b0a4b8d5a699d697"
            os_tag: ky10sp1
            uos20: "0"
          - target: kylin-v10-sp1
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "hxsoong/kylin@sha256:93ba61a4785720106a5d02306042c06f4465bfcd5f577246b0a4b8d5a699d697"
            os_tag: ky10sp1
            uos20: "0"
          - target: kylin-v10-sp2
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "hxsoong/kylin@sha256:a22d6cb8b9e407e8cbcaf1c20517b9807d79ec5015ecb59ca492fb84fe298ed5"
            os_tag: ky10sp2
            uos20: "0"
          - target: kylin-v10-sp2
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "hxsoong/kylin@sha256:a22d6cb8b9e407e8cbcaf1c20517b9807d79ec5015ecb59ca492fb84fe298ed5"
            os_tag: ky10sp2
            uos20: "0"
          - target: kylin-v10-sp3
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "hxsoong/kylin@sha256:b49a72ecf3213e00c5316935a51594c11d43fbccb13ad0cecf939f0f1c1101a3"
            os_tag: ky10sp3
            uos20: "0"
          - target: kylin-v10-sp3
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "hxsoong/kylin@sha256:b49a72ecf3213e00c5316935a51594c11d43fbccb13ad0cecf939f0f1c1101a3"
            os_tag: ky10sp3
            uos20: "0"
          - target: uos20
            arch: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            image: "quay.io/centos/centos:stream8"
            os_tag: uos20
            uos20: "1"
          - target: uos20
            arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: "quay.io/centos/centos:stream8"
            os_tag: uos20
            uos20: "1"

    env:
      TARGET_ID: ${{ matrix.target }}
      TARGET_ARCH: ${{ matrix.arch }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      BASE_IMAGE: ${{ matrix.image }}
      FORCE_OS_TAG: ${{ matrix.os_tag }}
      UOS20: ${{ matrix.uos20 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Remove repository source archives
        run: rm -f openssh-*.tar.gz openssl-*.tar.gz

      - name: Download verified sources
        uses: actions/download-artifact@v4
        with:
          name: verified-sources
          path: .

      - name: Build builder image
        run: |
          set -e
          docker build --platform "$TARGET_PLATFORM" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            -t "openssh-builder:${TARGET_ID}-${TARGET_ARCH}" .

      - name: Build RPMs
        run: |
          set -e
          mkdir -p output
          docker run --rm --platform "$TARGET_PLATFORM" \
            -e FORCE_OS_TAG="$FORCE_OS_TAG" \
            -e UOS20="$UOS20" \
            -v "$GITHUB_WORKSPACE:/build" \
            -v "$GITHUB_WORKSPACE/output:/opt" \
            "openssh-builder:${TARGET_ID}-${TARGET_ARCH}" \
            bash -c "cd /build && printf '2\\n' | bash build_openssh.sh"

      - name: Collect artifact
        run: |
          set -e
          SOURCE="$(find output -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          [ -n "$SOURCE" ] || { echo "未找到 RPM 压缩包"; exit 1; }
          mkdir -p dist
          cp "$SOURCE" "dist/openssh-${SSH_VERSION}-rpms-${TARGET_ID}-${TARGET_ARCH}.tar.gz"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.target }}-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpms-*
          path: release-assets
          merge-multiple: true

      - name: Prepare Release
        run: |
          set -e
          echo "RELEASE_TAG=v${SSH_VERSION}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          test "$(find release-assets -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 26
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OpenSSH ${{ env.SSH_VERSION }} RPMs (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: release-assets/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
